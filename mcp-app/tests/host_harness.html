<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MCP Apps host harness</title>
<style>body{font-family:Segoe UI,sans-serif;margin:16px;background:#fafafa} iframe{width:860px;border:1px solid #ccc;border-radius:8px;background:#fff} #log{font:12px monospace;white-space:pre-wrap;max-height:180px;overflow:auto;background:#111;color:#9f9;padding:8px;width:844px}</style>
</head><body>
<h3>Simulated Copilot host (MCP Apps) <select id="theme"><option>light</option><option>dark</option></select></h3>
<iframe id="f" sandbox="allow-scripts" height="300"></iframe>
<div id="log"></div>
<script>
const log = m => { document.getElementById('log').textContent += m + "\n"; };
const f = document.getElementById('f');
let payload;
const payloadUrl = new URLSearchParams(location.search).get('payload') || '/tests/sample_payload.json';
Promise.all([fetch('/widget/dashboard.html').then(r=>r.text()), fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json'},
  body: JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/call',params:{name:'render_dashboard',arguments:null}})}).catch(()=>null),
  fetch(payloadUrl).then(r=>r.json())]).then(([html,_,sample]) => { payload = sample; f.srcdoc = html; });
window.addEventListener('message', e => {
  const m = e.data; if (!m || m.jsonrpc !== '2.0') return;
  log('view -> host: ' + m.method + (m.method==='ui/notifications/size-changed' ? ' ' + JSON.stringify(m.params) : ''));
  const reply = r => f.contentWindow.postMessage({jsonrpc:'2.0', id:m.id, result:r}, '*');
  if (m.method === 'ui/initialize') reply({protocolVersion:'2026-01-26', hostInfo:{name:'harness',version:'1'}, hostCapabilities:{openLinks:{}},
      hostContext:{theme:document.getElementById('theme').value, displayMode:'inline', availableDisplayModes:['inline','fullscreen']}});
  if (m.method === 'ui/notifications/initialized') {
    f.contentWindow.postMessage({jsonrpc:'2.0', method:'ui/notifications/tool-input', params:{arguments:payload}}, '*');
    // structuredContent normally comes from the server's tools/call result
    setTimeout(()=>f.contentWindow.postMessage({jsonrpc:'2.0', method:'ui/notifications/tool-result',
      params:{content:[{type:'text',text:'Dashboard rendered'}], structuredContent: window.SC || payload}}, '*'), 300);
  }
  if (m.method === 'ui/notifications/size-changed') f.style.height = m.params.height + 'px';
  if (m.method === 'ui/open-link') { log('   open link: ' + m.params.url); reply({}); }
  if (m.method === 'ui/message') { log('   message to chat: ' + m.params.content.text); reply({}); }
  if (m.method === 'ui/request-display-mode') reply({mode: m.params.mode});
});
document.getElementById('theme').onchange = ev => f.contentWindow.postMessage({jsonrpc:'2.0', method:'ui/notifications/host-context-changed', params:{theme: ev.target.value}}, '*');
</script></body></html>
